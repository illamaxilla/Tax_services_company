[build]
  publish = "."
  command = ""

# index.html is the follow-up questionnaire (Schedule DP-2): a single
# self-contained file with fonts and runtime inlined, no build step, no
# server. Every answer stays in the respondent's own browser until they
# save a PDF or download the data file.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=0, must-revalidate"

# The follow-up questionnaire is the only schedule served, at the site root.
# Old clean URLs point back to it so no prior link dead-ends.
[[redirects]]
  from = "/dp-1"
  to = "/"
  status = 301

[[redirects]]
  from = "/dp-2"
  to = "/"
  status = 301

# The source components are kept in /src for editing, not for serving.
[[redirects]]
  from = "/src/*"
  to = "/"
  status = 404

# The retired DP1 build is kept in /archive for reference only, not for serving.
[[redirects]]
  from = "/archive/*"
  to = "/"
  status = 404
