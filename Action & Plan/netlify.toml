[build]
  publish = "."
  command = ""

# index.html (DP-1), dp-2.html (DP-2) and documents.html (proposal +
# action pack) are single
# self-contained files: fonts and runtime inlined, no build step, no server.
# Every answer stays in the respondent's own browser until they save a PDF
# or download the data file.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=0, must-revalidate"

# Clean URLs for the two schedules.
[[redirects]]
  from = "/dp-1"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dp-2"
  to = "/dp-2.html"
  status = 200

# The source components are kept in /src for editing, not for serving.
[[redirects]]
  from = "/documents"
  to = "/documents.html"
  status = 200

[[redirects]]
  from = "/src/*"
  to = "/"
  status = 404
